name: Generate ASCII artwork

on: push

jobs:
    ascii_job:
        runs-on: ubuntu-latest

        steps:
        - name: Checkout Repo
          uses: actions/checkout@v7

        - name: Executing shell scripts
          run: |
            chmod +x ascii-script.sh
            bash ascii-script.sh
        
        - name: list Repo Files
          run: ls -lrta
